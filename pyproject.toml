[tool.poetry]
name = "space-toolkit"
version = "0.1.0"
description = "Toolkit profesional en Python para análisis de exoplanetas de la NASA y simulación de órbitas físicas."
authors = ["Matute0512 <matiast999@hotmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
pandas = "^2.2.0"
matplotlib = "<3.7.0"
astropy = "^5.3.0"
poliastro = "^0.17.0"
streamlit = "^1.58.0"
plotly = "<6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"